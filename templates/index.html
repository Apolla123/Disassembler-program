<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Декодирование</title>

    <style>
        body {margin: 20px; background: #eef7fc;}

        textarea {width: 100%; height: 200px;}

        button {padding: 10px 20px; background: #4CAF50;
                color: white; cursor: pointer;}

        pre {background: #f9f9f9; padding: 15px;
            border: 1px solid #000; white-space: pre;}
    </style>
</head>

<body>
    <h1>Декодирование</h1>

    <textarea id="machineCode" placeholder="Вставьте строки Intel HEX"></textarea>
    <button id="submitButton">Отправить</button>

    <h2>Листинг</h2>
    <pre id="listing">Результат появится здесь.</pre>

    <script>
        const input = document.getElementById('machineCode');
        const listing = document.getElementById('listing');
        const button = document.getElementById('submitButton');

        // Отправляем HEX-код на сервер и выводим листинг
        button.addEventListener('click', async () => {
            // отправляем запрос на адрес /decode
            const response = await fetch('/decode', {method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({machine_code: input.value})});

            const data = await response.json();
            listing.textContent = data.listing;});
    </script>
</body>
</html>
